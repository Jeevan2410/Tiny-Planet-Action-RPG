name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing the built site is a push to the gh-pages branch, which GitHub Pages
# serves directly. The alternative — the actions/deploy-pages route — needs Pages
# configured with "GitHub Actions" as its source, and the workflow token is not
# allowed to make that change itself.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Publish dist to gh-pages
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # .nojekyll stops Pages running the output through Jekyll.
          touch dist/.nojekyll
          cd dist
          git init -q
          git checkout -qb gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish ${GITHUB_SHA:0:7}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
